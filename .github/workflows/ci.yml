name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      AB_OFFLINE_MODE: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check app src tests run.py

      - name: Test
        run: python -m pytest

      - name: Run evaluations
        run: python -m app.evaluation.run_all

      - name: Upload evaluation reports
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-reports
          path: reports/*.json
        if-no-files-found: error

  auditor:
    runs-on: ubuntu-latest
    env:
      ABA_OUTPUT_DIR: outputs
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run the Auditor evaluation
        run: python -m agent_bazaar_auditor evaluate

      - name: Upload Auditor reports
        uses: actions/upload-artifact@v4
        with:
          name: auditor-reports
          path: outputs/reports/
        if-no-files-found: error

  knowledge-layer:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: "src"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Build the offline ontology
        run: python scripts/build_ontology.py --offline

      - name: Seed the knowledge graph
        run: python scripts/seed_graph.py --offline --hash-embeddings

      - name: Run the Mapper demonstration
        run: python scripts/demo_mapper.py

      - name: Validate the published graph
        run: |
          python -c "from rdflib import Graph; from agent_bazaar.ontology.validator import validate_graph; graph = Graph(); graph.parse('data/out/graph.ttl'); result = validate_graph(graph); print('conforms', result.conforms, 'violations', len(result.violations)); raise SystemExit(0 if result.conforms else 1)"

      - name: Upload knowledge layer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-layer-artifacts
          path: |
            data/out/ontology.ttl
            data/out/graph.ttl
            data/out/logs/
        if-no-files-found: error
