apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-bazaar
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agent-bazaar
  template:
    metadata:
      labels:
        app: agent-bazaar
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: agent-bazaar
          image: agent-bazaar:latest
          ports:
            - containerPort: 8000
          env:
            - name: AB_OFFLINE_MODE
              value: "true"
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: agent-bazaar
spec:
  selector:
    app: agent-bazaar
  ports:
    - port: 80
      targetPort: 8000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: agent-bazaar
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: agent-bazaar
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: agent-bazaar
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: agent-bazaar
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-bazaar
spec:
  podSelector:
    matchLabels:
      app: agent-bazaar
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from: []
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to: []
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
