[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-bazaar"
version = "0.1.0"
description = "Agent Bazaar: ontology- and knowledge-graph-driven multi-agent system"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "pydantic>=2.5",
    "rdflib>=7.0",
    "pyshacl>=0.25",
    "numpy>=1.26",
    "PyYAML>=6.0",
    "requests>=2.31",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic-settings>=2.5,<3.0",
    "httpx>=0.27,<1.0",
    "jinja2>=3.1,<4.0",
    "python-multipart>=0.0.9,<1.0",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=2.5"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "pytest-asyncio>=0.24,<1.0", "ruff>=0.7,<1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
