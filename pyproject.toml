[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-bazaar"
version = "0.2.0"
description = "Agent Bazaar: ontology- and knowledge-graph-driven multi-agent system"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.5",
    "rdflib>=7.0",
    "pyshacl>=0.25",
    "numpy>=1.26",
    "PyYAML>=6.0",
    "requests>=2.31",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic-settings>=2.5,<3.0",
    "httpx>=0.27,<1.0",
    "jinja2>=3.1,<4.0",
    "python-multipart>=0.0.9,<1.0",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=2.5"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24,<1.0",
    "ruff>=0.7,<1.0",
]

[project.scripts]
agent-bazaar-auditor = "agent_bazaar_auditor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv", ".cache", "outputs", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"src/agent_bazaar_auditor/**/*.py" = ["E501"]
"tests/test_auditor_api.py" = ["E501"]
"tests/test_auditor_evaluation.py" = ["E501"]
"tests/test_claims.py" = ["E501"]
"tests/test_cli.py" = ["E501"]
"tests/test_decision.py" = ["E501"]
"tests/test_drift.py" = ["E501"]
"tests/test_probes.py" = ["E501"]
"tests/test_trust_scheduler.py" = ["E501"]
